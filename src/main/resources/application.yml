server:
  port: 8081

spring:
  application:
    name: siase-os-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siase_os_db}
    username: ${DB_USER:siase_os_user}
    password: ${DB_PASSWORD:siase_pass}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  springdoc:
    swagger-ui:
      path: /api/swagger-ui.html
    api-docs:
      path: /api/v3/api-docs

app:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:}     # ex.: http://localhost:4566 p/ LocalStack
  sqs:
    billing-url: ${SQS_BILLING_URL:http://localhost:4566/000000000000/siase-billing-queue}
    execution-url: ${SQS_EXECUTION_URL:http://localhost:4566/000000000000/siase-execution-queue}
    os-eventos-url: ${SQS_OS_EVENTOS_URL:http://localhost:4566/000000000000/siase-os-eventos}
    os-updates-url: ${SQS_OS_UPDATES_URL:http://localhost:4566/000000000000/siase-os-updates-queue}
    poll-delay-ms: ${SQS_POLL_DELAY_MS:5000}
  dynamodb:
    historico-table: ${DYNAMODB_HISTORICO_TABLE:siase-homolog-os-eventos-historico}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:homolog}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: info
