spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

aws:
  region: us-east-1
  sqs:
    queue-url-os-eventos: https://sqs.us-east-1.amazonaws.com/test/os-eventos
    queue-url-billing: https://sqs.us-east-1.amazonaws.com/test/billing
    queue-url-execution: https://sqs.us-east-1.amazonaws.com/test/execution
    queue-url-os-updates: https://sqs.us-east-1.amazonaws.com/test/os-updates
    poll-interval-ms: 999999999
  dynamodb:
    table-eventos: siase-os-eventos-test

jwt:
  secret: dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHkxMjM0NTY=
